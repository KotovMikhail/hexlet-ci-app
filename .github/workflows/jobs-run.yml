# file: .github/workflows/jobs-run.yml
name: jobs-run
# on – определяет события, которые запускают воркфлоу
on: push

jobs:
  build: # имя взято для примера
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
      - run: make setup
      - run: make test
      - run: make lint
